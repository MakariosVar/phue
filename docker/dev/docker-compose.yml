version: '3.8'
services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: phue_app
        user: "1000:1000"
        network_mode: host
        volumes:
            - ../..:/app
        working_dir: /app
        stdin_open: true # keeping interactive terminal alive
        tty: true        # keeping interactive terminal alive
    redis:
        image: redis:7-alpine
        container_name: phue_redis
        ports:
            - "6379:6379"